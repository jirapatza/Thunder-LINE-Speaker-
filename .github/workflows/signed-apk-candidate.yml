name: Signed Android APK candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
      ANDROID_VERSION_NAME: '0.5.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fail closed until real Firebase and permanent signing key exist
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD FIREBASE_ANDROID_APP_ID FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID; do
            test -n "${!name:-}" || { echo "::error::$name missing - no installable release"; exit 1; }
          done
      - name: Prepare stable keystore in temporary runner directory
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/thunder-release.jks" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/thunder-release.jks"
          test -s "$RUNNER_TEMP/thunder-release.jks"
          chmod 600 "$RUNNER_TEMP/thunder-release.jks"
      - name: Unit tests and signed APK candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace --console=plain
      - name: Verify signature and APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Upload signed build candidate
        uses: actions/upload-artifact@v4
        with:
          name: thunder-line-speaker-signed-v0.5-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
